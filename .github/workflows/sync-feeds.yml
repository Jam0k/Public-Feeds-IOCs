name: Sync IOC feeds

# Snapshots the ThreatCluster public feeds into this repo so the git history
# becomes a timestamped record: "when did this indicator first appear?" is a
# `git log` away, which neither the API nor a static URL can answer.
#
# Runs from GitHub (not the ThreatCluster infrastructure) on purpose — an
# outage upstream leaves the last good snapshot intact rather than emptying
# the files.

on:
  schedule:
    # 06:15 UTC daily. Offset from the hour because GitHub's scheduler queues
    # heavily on :00 and jobs can be delayed or dropped.
    - cron: '15 6 * * *'
  workflow_dispatch:        # manual run from the Actions tab

permissions:
  contents: write           # only what's needed to commit

concurrency:
  group: sync-feeds
  cancel-in-progress: false # never interrupt a partial commit

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch feeds
        run: |
          set -euo pipefail
          mkdir -p feeds

          BASE="https://threatcluster.io/api/iocs/public"
          fetch() {
            # Fail the job rather than commit a truncated or error-page file.
            # --fail turns HTTP >=400 into a non-zero exit; the temp-file dance
            # means a partial download can never overwrite a good snapshot.
            local src="$1" dest="$2" min="$3"
            echo "fetching $src"
            # Explicit failure check: --fail exits non-zero on HTTP >=400, but
            # without this guard the function would fall through to `wc` and
            # `mv` on a file that was never created.
            if ! curl -sS --fail --max-time 60 --retry 3 --retry-delay 5 \
                 -A "ThreatCluster-Feed-Sync/1.0 (+https://github.com/Jam0k/Public-Feeds-IOCs)" \
                 "$BASE/$src" -o "$dest.tmp"; then
              echo "::error::$src fetch failed — keeping previous snapshot"
              rm -f "$dest.tmp"
              exit 1
            fi
            local size
            size=$(wc -c < "$dest.tmp")
            if [ "$size" -lt "$min" ]; then
              echo "::error::$src returned $size bytes (minimum $min) — refusing to overwrite"
              rm -f "$dest.tmp"
              exit 1
            fi
            mv "$dest.tmp" "$dest"
          }

          # 30-day block-ready set — the recommended feeds.
          fetch domains.txt  feeds/domains.txt   32
          fetch domains.csv  feeds/domains.csv   64
          fetch ips.txt      feeds/ips.txt       16
          fetch ips.csv      feeds/ips.csv       64
          fetch hashes.txt   feeds/hashes.txt   256
          fetch hashes.csv   feeds/hashes.csv   256
          fetch crypto.txt   feeds/crypto.txt    32
          fetch crypto.csv   feeds/crypto.csv    64
          fetch feed.txt     feeds/all.txt      128
          fetch feed.csv     feeds/all.csv      128
          fetch feed.json    feeds/all.json     128
          fetch stats        feeds/stats.json    32

          # Full history — hunt/retrospective, NOT block-ready. Kept in a
          # separate directory so nobody wires feeds/domains.txt and
          # feeds/full/domains.txt into the same blocklist by accident.
          mkdir -p feeds/full
          fetch full/domains.txt feeds/full/domains.txt   32
          fetch full/domains.csv feeds/full/domains.csv   64
          fetch full/ips.txt     feeds/full/ips.txt       16
          fetch full/ips.csv     feeds/full/ips.csv       64
          fetch full/hashes.txt  feeds/full/hashes.txt   256
          fetch full/hashes.csv  feeds/full/hashes.csv   256
          fetch full/crypto.txt  feeds/full/crypto.txt    32
          fetch full/crypto.csv  feeds/full/crypto.csv    64
          fetch full/feed.csv    feeds/full/all.csv      128
          fetch full/feed.json   feeds/full/all.json     128
          fetch full/stats       feeds/full/stats.json    32

      - name: Update README stats
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, pathlib, datetime
          stats = json.loads(pathlib.Path('feeds/stats.json').read_text())
          by = stats.get('by_type', {})
          # Full-history totals sit alongside the 30-day ones so the table
          # shows both "what to block now" and "how deep the archive goes".
          full = {}
          fp = pathlib.Path('feeds/full/stats.json')
          if fp.exists():
              try:
                  full = {r['type']: r['count']
                          for r in json.loads(fp.read_text()).get('by_type', [])}
              except Exception:
                  full = {}
          types = sorted(set(by) | set(full), key=lambda k: -(full.get(k) or by.get(k, 0)))
          rows = "\n".join(
              f"| {k} | {by.get(k, 0)} | {full.get(k, '—')} |"
              for k in types if by.get(k) or full.get(k)
          )
          block = (
              "<!--STATS-->\n"
              f"_Last updated: {datetime.datetime.utcnow():%Y-%m-%d %H:%M} UTC_\n\n"
              f"**{stats.get('count', 0)} network indicators** · "
              f"**{stats.get('hash_count', 0)} hashes** · "
              f"**{stats.get('crypto_count', 0)} wallets** · "
              f"{stats.get('window_days', 30)}-day window\n\n"
              "| Type | Last 30 days | All time |\n|---|---|---|\n" + rows + "\n"
              "<!--/STATS-->"
          )
          p = pathlib.Path('README.md')
          md = p.read_text()
          if '<!--STATS-->' in md:
              md = re.sub(r'<!--STATS-->.*?<!--/STATS-->', block, md, flags=re.S)
          else:
              md = md.rstrip() + "\n\n---\n\n## Current feed\n\n" + block + "\n"
          p.write_text(md)
          PY

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name  "threatcluster-bot"
          git config user.email "hello@threatcluster.io"
          git add feeds README.md
          # Commit ONLY on a real content change. A daily empty commit would
          # make `git log` useless for answering "when did this appear?".
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          NET=$(grep -vc '^#' feeds/all.txt || true)
          git commit -m "feeds: ${NET} network indicators ($(date -u +%Y-%m-%d))"
          git push
